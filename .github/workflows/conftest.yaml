name: Validate

on: [push, pull_request]

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Conftest
        uses: redhat-cop/github-actions/confbatstest@v4.5
        with:
          tests: _test/conftest.sh
