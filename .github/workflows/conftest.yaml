name: Validate

on: [push, pull_request]

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Conftest
        uses: redhat-cop/github-actions/confbatstest@v4.5
        with:
          tests: _test/conftest.sh
